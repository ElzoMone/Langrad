name: Build offline German inflection index
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-forms.yml"
permissions:
  contents: write

jobs:
  build-german-forms:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Install pinned offline Simplemma data
        run: |
          python3 -m pip install --disable-pip-version-check 'simplemma==1.2.0'

      - name: Download German entries from Kaikki (build-time only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 20 --max-time 420 \
            'https://kaikki.org/dictionary/German/kaikki.org-dictionary-German.jsonl.gz' \
            -o tmp/german.jsonl.gz
          test "$(wc -c < tmp/german.jsonl.gz)" -gt 10000000
          gzip --test tmp/german.jsonl.gz

      - name: Construct sharded offline form index
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_forms.py --wiktionary tmp/german.jsonl.gz --out public/forms
          cat > public/forms/SOURCES.txt <<'EOF'
          Wiktionary German-language entries extracted from the English Wiktionary
          by Kaikki/Wiktextract (https://kaikki.org/dictionary/German/).
          Wiktionary contributors, Creative Commons Attribution-ShareAlike 4.0:
          https://en.wiktionary.org/wiki/Wiktionary:Copyrights
          https://creativecommons.org/licenses/by-sa/4.0/
          Data has been filtered, normalized and indexed for Langrad.

          Simplemma fallback: simplemma 1.2.0 by Adrien Barbaresi and contributors.
          https://pypi.org/project/simplemma/1.2.0/ - MIT license.
          Simplemma entries have NO assigned grammatical features; the source
          provides only the form-to-lemma relationship.

          Form-of analyses can be ambiguous. Multiple possibilities are preserved.
          For German-language definitions and text, see the original Wiktionary.
          No raw JSONL source or intermediate SQLite database is committed.
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('public/forms')
          manifest = json.loads((path/'manifest.json').read_text())
          assert manifest['unique_forms'] >= 400_000, manifest['unique_forms']
          assert manifest['analyses'] >= manifest['unique_forms']
          assert manifest['shard_count'] >= 300
          for word, expected in [
              ('erkannte', 'erkennen'),
              ('gegangen', 'gehen'),
              ('eingenommen', 'einnehmen'),
              ('diesen', 'dieser'),
              ('kam', 'kommen'),
              ('abgelöst', 'ablösen'),
              ('zigaretten', 'Zigarette')]:
              key = word[:2]
              data = json.loads((path/(key+'.json')).read_text())
              candidates = data.get(word, [])
              assert any(x[0] == expected for x in candidates), (word, expected, candidates[:3])
              print('PASS',word,'→',expected,len(candidates),'analyses')
          print('TOTAL',manifest['unique_forms'],manifest['analyses'],manifest['shard_count'])
          PY
          rm -f tmp/german.jsonl.gz

      - name: Commit ONLY generated shards and attribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/forms scripts/build_forms.py
          if git diff --cached --quiet; then
            echo 'Unchanged forms index'
          else
            git commit -m "feat(forms): publish Wiktionary and Simplemma offline inflection shards"
            git push origin HEAD:main
          fi
